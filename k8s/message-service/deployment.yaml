apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-message-service
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-message-service
  template:
    metadata:
      labels:
        app: relay-message-service
    spec:
      containers:
        - name: relay-message-service
          image: relay-message-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MESSAGE_DB_URL
              value: jdbc:postgresql://postgres:5432/message_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: relay-app-secrets
                  key: internal-api-key
            - name: USER_SERVICE_GRPC_ADDRESS
              value: relay-user-service:9090
          ports:
            - containerPort: 8083
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5