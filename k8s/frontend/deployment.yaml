apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-frontend
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-frontend
  template:
    metadata:
      labels:
        app: relay-frontend
    spec:
      containers:
        - name: relay-frontend
          image: relay-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3