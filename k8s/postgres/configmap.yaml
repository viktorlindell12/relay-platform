apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: relay
data:
  init-extra-dbs.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        CREATE DATABASE user_db;
        CREATE DATABASE message_db;
    EOSQL
