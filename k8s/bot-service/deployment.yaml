apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-bot-service
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-bot-service
  template:
    metadata:
      labels:
        app: relay-bot-service
    spec:
      containers:
        - name: relay-bot-service
          image: relay-bot-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: relay-app-secrets
                  key: internal-api-key
            - name: MESSAGE_SERVICE_URL
              value: http://relay-message-service:8083
            - name: BOT_USER_ID
              value: "0"
          ports:
            - containerPort: 8084
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5