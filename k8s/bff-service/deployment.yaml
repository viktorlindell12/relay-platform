apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-bff-service
  namespace: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-bff-service
  template:
    metadata:
      labels:
        app: relay-bff-service
    spec:
      containers:
        - name: relay-bff-service
          image: relay-bff-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: relay-app-secrets
                  key: jwt-secret
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: relay-app-secrets
                  key: internal-api-key
            - name: AUTH_SERVICE_URL
              value: http://relay-auth-service:8081
            - name: USER_SERVICE_URL
              value: http://relay-user-service:8082
            - name: MESSAGE_SERVICE_URL
              value: http://relay-message-service:8083
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5