# Replace all values before applying.
# Never commit real credentials to source control.
# Consider Sealed Secrets or External Secrets Operator for production.
#
# Create namespace first: kubectl create namespace relay
# Apply: kubectl apply -f k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: relay
type: Opaque
stringData:
  username: relay
  password: changeme
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: relay
type: Opaque
stringData:
  username: guest
  password: guest
---
apiVersion: v1
kind: Secret
metadata:
  name: relay-app-secrets
  namespace: relay
type: Opaque
stringData:
  jwt-secret: replace-with-a-secure-random-256-bit-secret
  internal-api-key: replace-with-a-secure-random-key
