# Replace all values before applying.
# Never commit real credentials to source control.
# Consider Sealed Secrets or External Secrets Operator for production.
#
# Create namespace first: kubectl create namespace relay
# Apply: kubectl apply -f k8s/secrets.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: relay
type: Opaque
stringData:
  username: relay
  password: changeme
